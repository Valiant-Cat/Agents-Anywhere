name: 自部署服务器

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-self-hosted
  cancel-in-progress: false

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: self-hosted
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 校验发布标签及分支
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "仅允许正式版本标签，例如 v2.2.1"
            exit 1
          }
          git fetch origin self-hosted
          git merge-base --is-ancestor HEAD origin/self-hosted || {
            echo "标签提交必须属于 self-hosted 分支"
            exit 1
          }
          commit=$(git rev-parse HEAD)
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          import tomllib
          with open("server/pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("标签与 Server 版本不一致，停止部署")
          PY
      - name: 构建部署镜像
        run: |
          docker build -f docker/Dockerfile -t "agents-anywhere-deploy:$RELEASE_COMMIT" .
          docker save "agents-anywhere-deploy:$RELEASE_COMMIT" | gzip > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
      - name: 配置专用 SSH 密钥
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
      - name: 上传并部署
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          remote="root@$DEPLOY_HOST"
          options="-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30"
          ssh $options "$remote" "mkdir -p /opt/agents-anywhere/incoming/$RELEASE_COMMIT"
          scp $options image.tar.gz image.tar.gz.sha256 scripts/deploy-self-hosted.sh "$remote:/opt/agents-anywhere/incoming/$RELEASE_COMMIT/"
          ssh $options "$remote" "bash /opt/agents-anywhere/incoming/$RELEASE_COMMIT/deploy-self-hosted.sh $RELEASE_COMMIT"
      - name: 清理临时密钥
        if: always()
        run: rm -f ~/.ssh/id_ed25519
