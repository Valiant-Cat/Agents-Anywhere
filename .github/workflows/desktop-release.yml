name: 自部署全平台发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要发布的正式版本标签，例如 v2.2.0.3
        required: true
        type: string
      reuse_mac_run:
        description: 复用 macOS 成功产物的运行编号，留空则构建
        type: string
      reuse_windows_run:
        description: 复用 Windows 成功产物的运行编号，留空则构建
        type: string
      reuse_android_run:
        description: 复用 Android 成功产物的运行编号，留空则构建
        type: string
      reuse_ios_run:
        description: 复用已上传 TestFlight 的运行编号，留空则构建上传
        type: string

permissions:
  contents: read
  actions: read

env:
  REUSE_MAC_RUN: ${{ inputs.reuse_mac_run }}
  REUSE_WINDOWS_RUN: ${{ inputs.reuse_windows_run }}
  REUSE_ANDROID_RUN: ${{ inputs.reuse_android_run }}
  REUSE_IOS_RUN: ${{ inputs.reuse_ios_run }}

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      matrix: ${{ steps.reuse.outputs.matrix }}
      build_desktop: ${{ steps.reuse.outputs.build_desktop }}
    steps:
      - name: 检出发布源码
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - name: 检出本次工作流工具
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release-tools
      - name: 校验标签、版本及分支
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_config.py'
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG=$(python3 -c 'import tomllib; print("v" + tomllib.load(open("server/pyproject.toml", "rb"))["project"]["version"])')
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          export RELEASE_TAG
          git checkout --detach "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git fetch origin self-hosted-2.2.0
          git merge-base --is-ancestor HEAD origin/self-hosted-2.2.0
          python3 - <<'PY'
          import os
          import tomllib
          with open("server/pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("标签与 Server 版本不一致")
          PY
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release.json; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "不覆盖正式 Release，请递增版本"'
          fi
          python3 scripts/release-config.py "$RELEASE_TAG"
          echo 'matrix={"include":[{"os":"macos-15","platform":"mac","arch":"universal","extension":"dmg","asset":"Agents-Anywhere-latest.dmg"},{"os":"windows-latest","platform":"win","arch":"x64","extension":"exe","asset":"Agents-Anywhere-Setup-latest.exe"}]}' >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 检查移动端签名配置
        env:
          CLOUD_SERVER_URL: ${{ vars.CLOUD_SERVER_URL }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/release-config.py --check-secrets
      - name: 记录发布配置并选择构建平台
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VARIABLES: ${{ toJSON(vars) }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT_P12_BASE64: ${{ secrets.WIN_CERT_P12_BASE64 }}
        run: |
          python3 -m unittest discover -s release-tools/scripts -p 'test_release_reuse.py'
          python3 release-tools/scripts/release-reuse.py prepare --tag '${{ steps.version.outputs.tag }}' --commit '${{ steps.version.outputs.commit }}'
      - name: 保存发布追溯记录
        uses: actions/upload-artifact@v4
        with:
          name: release-context
          path: release-context/context.json
          retention-days: 7
          if-no-files-found: error

  android:
    needs: validate
    if: inputs.reuse_android_run == ''
    uses: ./.github/workflows/android-release.yml
    with:
      commit: ${{ needs.validate.outputs.commit }}
      release_tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit

  ios:
    needs: validate
    if: inputs.reuse_ios_run == ''
    uses: ./.github/workflows/ios-testflight.yml
    with:
      commit: ${{ needs.validate.outputs.commit }}
      release_tag: ${{ needs.validate.outputs.tag }}
      upload: true
    secrets: inherit

  build:
    needs: validate
    if: needs.validate.outputs.build_desktop == 'true'
    strategy:
      fail-fast: false
      # 按矩阵顺序优先构建 macOS，再构建 Windows。
      max-parallel: 1
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CLOUD_SERVER_URL: ${{ vars.CLOUD_SERVER_URL }}
      CLOUD_OAUTH_WEB_ORIGIN: ${{ vars.CLOUD_OAUTH_WEB_ORIGIN }}
      DESKTOP_UPDATE_MAC_URL: ${{ vars.DESKTOP_UPDATE_MAC_URL }}
      DESKTOP_UPDATE_WINDOWS_URL: ${{ vars.DESKTOP_UPDATE_WINDOWS_URL }}
    defaults:
      run:
        shell: bash
        working-directory: desktop-workbench
    steps:
      - name: 检出固定提交
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - name: 安装桌面依赖
        uses: ./.github/actions/setup-yarn
        with:
          project: desktop-workbench
          node-version: '22'
      - name: 注入自部署配置及安装包版本
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
          import { packageVersion } from "./scripts/release-version.mjs";
          const server = new URL(process.env.CLOUD_SERVER_URL);
          if (server.protocol !== "https:" || server.username || server.password ||
              server.pathname !== "/" || server.search || server.hash) {
            throw new Error("必须设置有效的 HTTPS CLOUD_SERVER_URL 仓库变量");
          }
          const values = {
            CLOUD_OAUTH_WEB_ORIGIN: process.env.CLOUD_OAUTH_WEB_ORIGIN || server.origin,
            DESKTOP_UPDATE_MAC_URL: process.env.DESKTOP_UPDATE_MAC_URL || `${server.origin}/download/mac/latest?from=update`,
            DESKTOP_UPDATE_WINDOWS_URL: process.env.DESKTOP_UPDATE_WINDOWS_URL || `${server.origin}/download/windows/latest?from=update`,
          };
          for (const [name, value] of Object.entries(values)) {
            if (/[\r\n]/.test(value)) throw new Error(`无效配置：${name}`);
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          pkg.version = packageVersion(process.env.RELEASE_VERSION);
          writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          JS
      - name: 桌面无界面检查
        run: |
          corepack yarn test:main
          corepack yarn renderer:typecheck
          node --test scripts/release-version.test.mjs
          if [[ -f scripts/mac-universal.test.mjs ]]; then node --test scripts/mac-universal.test.mjs; fi
      - name: 构建安装包
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT_P12_BASE64: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: corepack yarn dist:${{ matrix.platform }} --${{ matrix.arch }}
      - name: 核验包内配置并整理附件
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_EXTENSION: ${{ matrix.extension }}
          RELEASE_ASSET: ${{ matrix.asset }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { createRequire } from "node:module";
          import { copyFileSync, mkdirSync, readFileSync, readdirSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { packageVersion } from "./scripts/release-version.mjs";
          const require = createRequire(import.meta.url);
          const asar = require("@electron/asar");
          const root = process.env.RELEASE_PLATFORM === "mac"
            ? "release/mac-universal/Agents Anywhere.app/Contents/Resources"
            : "release/win-unpacked/resources";
          const read = (file) => JSON.parse(asar.extractFile(`${root}/app.asar`, file).toString());
          const config = read("dist/config.json");
          assert.equal(config.cloud.serverUrl, new URL(process.env.CLOUD_SERVER_URL).origin);
          assert.equal(config.cloud.oauthWebOrigin, new URL(process.env.CLOUD_OAUTH_WEB_ORIGIN).origin);
          assert.equal(config.updates.downloadUrls.darwin, process.env.DESKTOP_UPDATE_MAC_URL);
          assert.equal(config.updates.downloadUrls.win32, process.env.DESKTOP_UPDATE_WINDOWS_URL);
          assert.equal(read("dist/build-info.json").serverVersion, process.env.RELEASE_VERSION);
          assert.equal(read("package.json").version, packageVersion(process.env.RELEASE_VERSION));
          const files = readdirSync("release").filter((name) => name.endsWith(`.${process.env.RELEASE_EXTENSION}`));
          assert.equal(files.length, 1, "只能存在一个目标安装包");
          mkdirSync("release-assets", { recursive: true });
          const name = process.env.RELEASE_ASSET;
          copyFileSync(`release/${files[0]}`, `release-assets/${name}`);
          const hash = createHash("sha256").update(readFileSync(`release-assets/${name}`)).digest("hex");
          writeFileSync(`release-assets/${name}.sha256`, `${hash}  ${name}\n`);
          JS
      - name: 保存安装包及校验文件
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop-workbench/release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build, android, ios]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: 检出发布工具
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: 核验来源并汇总平台产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-reuse.py collect --tag '${{ needs.validate.outputs.tag }}' --commit '${{ needs.validate.outputs.commit }}'
      - name: 校验并发布正式 Release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          MAC_SIGNED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
          MAC_NOTARIZED: ${{ secrets.APPLE_ID != '' }}
          WIN_SIGNED: ${{ secrets.WIN_CERT_P12_BASE64 != '' }}
        run: |
          test -s Agents-Anywhere-latest.dmg
          test -s Agents-Anywhere-Setup-latest.exe
          test -s Agents-Anywhere-latest.apk
          sha256sum -c ./*.sha256
          printf 'macOS：通用包（Apple Silicon / Intel）；Windows：x64；Android：已签名 APK；iOS / iPadOS：已上传 TestFlight，处理及外部审核状态请在 App Store Connect 查看，不代表已开放公开下载。\n\n签名凭据已配置：macOS=%s，Apple 公证=%s，Windows=%s。\n未配置签名或公证的平台可能被系统拦截，不代表已经通过真实安装验证。\n\n源码提交：%s\n' \
            "$MAC_SIGNED" "$MAC_NOTARIZED" "$WIN_SIGNED" "$RELEASE_COMMIT" > notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > release.json; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "不覆盖正式 Release"'
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            Agents-Anywhere-latest.dmg Agents-Anywhere-latest.dmg.sha256 \
            Agents-Anywhere-Setup-latest.exe Agents-Anywhere-Setup-latest.exe.sha256 \
            Agents-Anywhere-latest.apk Agents-Anywhere-latest.apk.sha256 provenance.json
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --notes-file notes.md

  deploy:
    needs: [validate, publish]
    if: always() && needs.validate.result == 'success' && needs.publish.result == 'success'
    uses: ./.github/workflows/deploy-self-hosted.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit
